name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve_environment:
    name: Resolve deployment environment
    runs-on: ubuntu-latest
    outputs:
      deploy_environment: ${{ steps.resolve.outputs.deploy_environment }}
      dns_domain: ${{ steps.resolve.outputs.dns_domain }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}

    steps:
      - id: resolve
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${DEPLOY_BRANCH}" in
            test.rr1.us)
              echo "deploy_environment=derbyTest" >> "${GITHUB_OUTPUT}"
              echo "dns_domain=test.rr1.us" >> "${GITHUB_OUTPUT}"
              echo "github_environment=test.rr1.us" >> "${GITHUB_OUTPUT}"
              ;;
            go.rr1.us)
              echo "deploy_environment=go-derby-prod" >> "${GITHUB_OUTPUT}"
              echo "dns_domain=go.rr1.us" >> "${GITHUB_OUTPUT}"
              echo "github_environment=go.rr1.us" >> "${GITHUB_OUTPUT}"
              ;;
            stage.rr1.us)
              echo "deploy_environment=derbyStage" >> "${GITHUB_OUTPUT}"
              echo "dns_domain=stage.rr1.us" >> "${GITHUB_OUTPUT}"
              echo "github_environment=stage.rr1.us" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "No deployment configuration is defined for branch ${DEPLOY_BRANCH}" >&2
              exit 1
              ;;
          esac

  deploy:
    name: Deploy backend and frontend
    runs-on: ubuntu-latest
    needs: resolve_environment
    environment: ${{ needs.resolve_environment.outputs.github_environment }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_AwsRegion: ${{ vars.AWS_REGION }}
      TF_VAR_DeployEnvironment: ${{ needs.resolve_environment.outputs.deploy_environment }}
      TF_VAR_ManagedRolePermissionsBoundaryArn: ${{ vars.TF_VAR_MANAGED_ROLE_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_AcmArn: ${{ vars.TF_VAR_ACM_ARN }}
      TF_VAR_DnsDomain: ${{ needs.resolve_environment.outputs.dns_domain }}
      TF_VAR_DnsCloudfrontHostAlias: ${{ vars.TF_VAR_DNS_CLOUDFRONT_HOST_ALIAS }}
      TF_VAR_TimerApiGatewayDomain: ${{ vars.TF_VAR_TIMER_API_GATEWAY_DOMAIN }}
      TF_VAR_GoogleClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          [[ -n "${AWS_DEPLOY_ROLE_ARN}" ]] || (echo "Missing GitHub environment variable AWS_DEPLOY_ROLE_ARN" >&2 && exit 1)
          [[ -n "${AWS_REGION}" ]] || (echo "Missing GitHub environment variable AWS_REGION" >&2 && exit 1)
          [[ -n "${MANAGED_ROLE_PERMISSIONS_BOUNDARY_ARN}" ]] || (echo "Missing GitHub environment variable TF_VAR_MANAGED_ROLE_PERMISSIONS_BOUNDARY_ARN" >&2 && exit 1)
          [[ -n "${ACM_ARN}" ]] || (echo "Missing GitHub environment variable TF_VAR_ACM_ARN" >&2 && exit 1)
          [[ -n "${CLOUDFRONT_HOST_ALIAS}" ]] || (echo "Missing GitHub environment variable TF_VAR_DNS_CLOUDFRONT_HOST_ALIAS" >&2 && exit 1)
          [[ -n "${TIMER_API_GATEWAY_DOMAIN}" ]] || (echo "Missing GitHub environment variable TF_VAR_TIMER_API_GATEWAY_DOMAIN" >&2 && exit 1)
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          MANAGED_ROLE_PERMISSIONS_BOUNDARY_ARN: ${{ vars.TF_VAR_MANAGED_ROLE_PERMISSIONS_BOUNDARY_ARN }}
          ACM_ARN: ${{ vars.TF_VAR_ACM_ARN }}
          CLOUDFRONT_HOST_ALIAS: ${{ vars.TF_VAR_DNS_CLOUDFRONT_HOST_ALIAS }}
          TIMER_API_GATEWAY_DOMAIN: ${{ vars.TF_VAR_TIMER_API_GATEWAY_DOMAIN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: svelte-derby-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure Terraform backend
        env:
          TF_BACKEND_CONFIG_FILE: ${{ secrets.TF_BACKEND_CONFIG_FILE }}
          TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -n "${TF_BACKEND_CONFIG_FILE}" ]]; then
            printf '%s\n' "${TF_BACKEND_CONFIG_FILE}" > "${RUNNER_TEMP}/backend.hcl"
            echo "TF_BACKEND_CONFIG=${RUNNER_TEMP}/backend.hcl" >> "${GITHUB_ENV}"
          elif [[ -n "${TF_BACKEND_CONFIG}" ]]; then
            echo "TF_BACKEND_CONFIG=${TF_BACKEND_CONFIG}" >> "${GITHUB_ENV}"
          else
            echo "Missing Terraform backend config. Set TF_BACKEND_CONFIG_FILE secret or TF_BACKEND_CONFIG environment variable." >&2
            exit 1
          fi

      - name: Test backend
        working-directory: backend/test
        run: |
          npm ci
          npm run test:unit -- --silent

      - name: Plan backend
        working-directory: backend
        run: |
          make lambdaPkgs
          terraform init -reconfigure -backend-config="${TF_BACKEND_CONFIG}"
          terraform plan -out="${RUNNER_TEMP}/backend.tfplan"

      - name: Deploy planned backend
        working-directory: backend
        run: terraform apply -auto-approve "${RUNNER_TEMP}/backend.tfplan"

      - name: Deploy frontend
        working-directory: frontend
        run: ./buildAndPush.sh
