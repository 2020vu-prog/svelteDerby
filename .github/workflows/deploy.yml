name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub environment to plan or deploy
        required: true
        default: test.rr1.us
        type: choice
        options:
          - test.rr1.us
          - stage.rr1.us
          - go.rr1.us
      deployment_mode:
        description: Plan only, or apply the plan and deploy the frontend
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  resolve_environment:
    name: Resolve deployment environment
    runs-on: ubuntu-latest
    outputs:
      github_environment: ${{ steps.resolve.outputs.github_environment }}

    steps:
      - id: resolve
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          echo "github_environment=${TARGET_ENVIRONMENT}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: ${{ inputs.deployment_mode == 'live' && 'Deploy backend and frontend' || 'Plan backend and build frontend' }}
    runs-on: ubuntu-latest
    needs: resolve_environment
    environment: ${{ needs.resolve_environment.outputs.github_environment }}
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_AwsRegion: ${{ vars.AWS_REGION }}
      TF_VAR_DeployEnvironment: ${{ vars.TF_VAR_DeployEnvironment }}
      TF_VAR_ManagedRolePermissionsBoundaryArn: ${{ vars.TF_VAR_ManagedRolePermissionsBoundaryArn }}
      TF_VAR_AcmArn: ${{ vars.TF_VAR_AcmArn }}
      TF_VAR_DnsDomain: ${{ vars.TF_VAR_DnsDomain }}
      TF_VAR_DnsCloudfrontHostAlias: ${{ vars.TF_VAR_DnsCloudfrontHostAlias }}
      TF_VAR_TimerApiGatewayDomain: ${{ vars.TF_VAR_TimerApiGatewayDomain }}
      TF_VAR_GoogleClientId: ${{ secrets.TF_VAR_GoogleClientId }}
      TF_VAR_GoogleClientSecret: ${{ secrets.TF_VAR_GoogleClientSecret }}
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          [[ -n "${AWS_DEPLOY_ROLE_ARN}" ]] || (echo "Missing GitHub environment variable AWS_DEPLOY_ROLE_ARN" >&2 && exit 1)
          [[ -n "${AWS_REGION}" ]] || (echo "Missing GitHub environment variable AWS_REGION" >&2 && exit 1)
          [[ -n "${TF_VAR_DeployEnvironment}" ]] || (echo "Missing GitHub environment variable TF_VAR_DeployEnvironment" >&2 && exit 1)
          [[ -n "${TF_VAR_ManagedRolePermissionsBoundaryArn}" ]] || (echo "Missing GitHub environment variable TF_VAR_ManagedRolePermissionsBoundaryArn" >&2 && exit 1)
          [[ -n "${TF_VAR_AcmArn}" ]] || (echo "Missing GitHub environment variable TF_VAR_AcmArn" >&2 && exit 1)
          [[ -n "${TF_VAR_DnsDomain}" ]] || (echo "Missing GitHub environment variable TF_VAR_DnsDomain" >&2 && exit 1)
          [[ -n "${TF_VAR_DnsCloudfrontHostAlias}" ]] || (echo "Missing GitHub environment variable TF_VAR_DnsCloudfrontHostAlias" >&2 && exit 1)
          [[ -n "${TF_VAR_TimerApiGatewayDomain}" ]] || (echo "Missing GitHub environment variable TF_VAR_TimerApiGatewayDomain" >&2 && exit 1)
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: svelte-derby-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure Terraform backend
        env:
          TF_BACKEND_CONFIG_FILE_CONTENTS: ${{ secrets.TF_BACKEND_CONFIG_FILE_CONTENTS }}
          TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -n "${TF_BACKEND_CONFIG_FILE_CONTENTS}" ]]; then
            printf '%s\n' "${TF_BACKEND_CONFIG_FILE_CONTENTS}" > "${RUNNER_TEMP}/backend.hcl"
            echo "TF_BACKEND_CONFIG=${RUNNER_TEMP}/backend.hcl" >> "${GITHUB_ENV}"
          elif [[ -n "${TF_BACKEND_CONFIG}" ]]; then
            echo "TF_BACKEND_CONFIG=${TF_BACKEND_CONFIG}" >> "${GITHUB_ENV}"
          else
            echo "Missing Terraform backend config. Set TF_BACKEND_CONFIG_FILE_CONTENTS secret or TF_BACKEND_CONFIG environment variable." >&2
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test and package Node 22 Lambdas
        working-directory: backend
        run: |
          (
            cd modules/lambdaDynamo/src
            npm ci
            npm test
            make package.zip
          )
          (
            cd modules/lambdaSqs/src
            npm ci
            npm test
            make package.zip
          )
          (
            cd modules/lambdaDerby/src
            npm ci
            make package.zip
          )

      - name: Test backend with Node 22
        working-directory: backend/test
        run: |
          npm ci
          npm run test:unit -- --silent
          git diff --exit-code

      - name: Plan backend
        working-directory: backend
        run: |
          make lambdaPkgsNonNode
          terraform init -reconfigure -lockfile=readonly -backend-config="${TF_BACKEND_CONFIG}"
          git diff --exit-code
          terraform plan -out="${RUNNER_TEMP}/backend.tfplan"

      - name: Apply planned backend
        if: ${{ inputs.deployment_mode == 'live' }}
        working-directory: backend
        run: terraform apply -auto-approve "${RUNNER_TEMP}/backend.tfplan"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend
        if: ${{ inputs.deployment_mode == 'live' }}
        working-directory: frontend
        run: ./s3Push.sh
