name: Format

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: JavaScript, Svelte, and Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/modules/lambdaDerby/src/package-lock.json

      - name: Install frontend formatting tools
        working-directory: frontend
        run: npm ci

      - name: Check JavaScript and Svelte formatting
        run: ./prettier.sh --check

      # frontend/src/routes tests reach into backend/modules/lambdaDerby/src's
      # shared modules (e.g. PermissionLookup.js), which need their own deps
      # installed to resolve.
      - name: Install backend lambdaDerby dependencies
        working-directory: backend/modules/lambdaDerby/src
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .

      - name: Verify backend provider lock
        working-directory: backend
        run: terraform init -backend=false -lockfile=readonly
