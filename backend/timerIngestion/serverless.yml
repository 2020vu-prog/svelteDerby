# you can define service wide environment variables here
#  environment:
#    variable1: value1

# you can add packaging information here
#package:
#  include:
#    - include-me.js
#    - include-me-dir/**
#  exclude:
#    - exclude-me.js
#    - exclude-me-dir/**

functions:
    getUuid:
        handler: api/ingestTimes.getUuid
        memorySize: 128
        events:
            - http:
                  path: /timer/getUuid
                  method: get
    ingestTimes:
        handler: api/ingestTimes.submit
        memorySize: 128
        events:
            - http:
                  path: timer/ingestTimes
                  method: post
