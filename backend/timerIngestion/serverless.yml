service: timerIngestion
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
# frameworkVersion: "=X.X.X"

provider:
    name: aws
    runtime: nodejs12.x
    region: ${env:TF_VAR_AwsRegion}
    provider:
      logRetentionInDays: 5
    httpApi:
        id: 05wv6js1p4

    # you can overwrite defaults here
    #  stage: dev
    environment:
        DERBY_TIMER_TABLE: DerbyTimer
        TimerWinDeltaSns:  ${ssm:/sns/TimerWinDeltaSns/arn~true}
    iamRoleStatements:
        - Effect: Allow
          Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetItem
              - dynamodb:PutItem
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - SNS:Publish
          Resource: "*"

